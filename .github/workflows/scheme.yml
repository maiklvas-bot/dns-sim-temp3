name: Scheme

# Проверка агентской схемы: профили, реестр маршрутов, настройки, скрипт аудита.
# Без моделей и без установки зависимостей, нужен только Node. Идёт на каждый push в claude/** и на PR,
# полный CI (ci.yml) запускается на PR и push в dev и main.
on:
  push:
    branches:
      - "claude/**"
  pull_request:
    branches:
      - dev
      - main

jobs:
  scheme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify agent scheme
        run: node script/check-scheme.mjs
